<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behavior Elements Test</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #status {
            font-size: 18px;
            margin-bottom: 20px;
        }
        #tests {
            list-style: none;
            padding: 0;
        }
        #tests li {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .pass {
            background: #2d5a2d;
        }
        .fail {
            background: #5a2d2d;
        }
    </style>
</head>
<body>
    <h1>LUME Behavior Elements Test</h1>
    <div id="status">Loading...</div>
    <ul id="tests"></ul>
    
    <script type="module">
        async function runTests() {
            const statusEl = document.getElementById('status');
            const testsEl = document.getElementById('tests');
            const tests = [];
            
            function addTest(name, passed, error = null) {
                tests.push({ name, passed, error });
                const li = document.createElement('li');
                li.className = passed ? 'pass' : 'fail';
                li.innerHTML = `<strong>${name}:</strong> ${passed ? 'PASS' : 'FAIL'}${error ? ' - ' + error : ''}`;
                testsEl.appendChild(li);
            }
            
            try {
                // Test 1: Import LUME
                await import('lume');
                addTest('Import LUME', true);
            } catch (error) {
                addTest('Import LUME', false, error.message);
                return;
            }
            
            try {
                // Test 2: Check if behavior elements are defined
                const elementNames = [
                    'box-geometry',
                    'plane-geometry', 
                    'ply-geometry',
                    'sphere-geometry',
                    'basic-material',
                    'phong-material',
                    'points-material'
                ];
                
                for (const name of elementNames) {
                    const isRegistered = customElements.get(name) !== undefined;
                    addTest(`Element ${name} registered`, isRegistered);
                }
                
            } catch (error) {
                addTest('Check element registration', false, error.message);
            }
            
            try {
                // Test 3: Create behavior elements
                const planeGeometry = document.createElement('plane-geometry');
                addTest('Create plane-geometry element', planeGeometry instanceof HTMLElement);
                
                const phongMaterial = document.createElement('phong-material');
                addTest('Create phong-material element', phongMaterial instanceof HTMLElement);
                
            } catch (error) {
                addTest('Create behavior elements', false, error.message);
            }
            
            const passedTests = tests.filter(t => t.passed).length;
            const totalTests = tests.length;
            statusEl.textContent = `Tests completed: ${passedTests}/${totalTests} passed`;
        }
        
        runTests().catch(error => {
            document.getElementById('status').textContent = 'Test failed: ' + error.message;
        });
    </script>
</body>
</html>
