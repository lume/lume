<script src="./template.js" template="./template.html" title="<lume-line>"></script>

<lume-scene id="scene" perspective="800" webgl>
	<lume-camera-rig active distance="1000" max-distance="6000" min-distance="10"></lume-camera-rig>
</lume-scene>

<style>
	body {
		/* dark deep pink to dark gray radial gradient */
		background: radial-gradient(circle, #460126 0%, #2f2f2f 100%);
	}
</style>

<script type="module">
	import {html} from 'lume'

	let angle = 0
	let distance = 0
	let z = 0

	scene.append(html/*html*/ `
		<lume-line id="line" rotation="90 0 0" rotation=${() => (x, y, z) => [x, y, z - 1]}>
			<lume-basicline-material color="deeppink"></lume-basicline-material>

			<lume-line-geometry
				points=${Array.from({length: 1200}).reduce((points, _, i) => {
					// Generate points for a spiral-shaped line.
					points.push(distance * Math.cos(angle), distance * Math.sin(angle), 200 * Math.sin(z))

					angle += Math.PI / 64
					distance += 2.5
					z += Math.PI / 20

					return points
				}, [])}
			></lume-line-geometry>
		</lume-line>
	`)
</script>
