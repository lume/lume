<script src="./template.js" template="./template.html" title="Bit Mae + Particle Explode"></script>

<style>
	bit-mae {
		width: 100%;
		height: 100%;
		background: #0a0a0f;
	}
</style>

<bit-mae onclick="particles.explode()">
	<particle-explode
		slot="alter-ego"
		count="40"
		decay-time="1.0"
		velocity="800"
		intensity="1000000"
		colors="#ff2266,#22ff88,#4488ff,#ffaa00,#ee44ff,#00ddff"
	></particle-explode>
</bit-mae>

<script>
	const particles = document.querySelector('particle-explode')
	setTimeout(() => particles.explode(), 800)
</script>

<script type="module">
	// Import nimble-html's html tag, and the example custom element Base class,
	// directly via githack using a specific commit hash. You can do this with
	// any GitHub URL at https://raw.githack.com.
	import {html as nimbleHtml} from 'https://rawcdn.githack.com/lume/nimble-html/70e433132a2ce4bc0a32b1aed5c1ede611f790ac/html.js'
	import {Base} from 'https://rawcdn.githack.com/lume/nimble-html/70e433132a2ce4bc0a32b1aed5c1ede611f790ac/examples/custom-elements/Base.js'

	import {Element3D, element, attribute, Motor, html} from 'lume'
	import {onCleanup} from 'solid-js'

	class BitMae extends Base {
		template() {
			return nimbleHtml`
				<style>
					:host {display: block}
				</style>

				<lume-scene
					id="scene"
					webgl="true"
					perspective="800"
				>
					<!-- Ambient fill lights around the scene -->
					<lume-point-light
						position="-600 300 400"
						intensity="400000"
						color="#4466aa"
						cast-shadow="false"
					></lume-point-light>
					<lume-point-light
						position="500 -200 300"
						intensity="300000"
						color="#aa44ff"
						cast-shadow="false"
					></lume-point-light>
					<lume-point-light
						position="200 500 -400"
						intensity="300000"
						color="#44ffaa"
						cast-shadow="false"
					></lume-point-light>
					<lume-point-light
						position="1000 -500 -400"
						intensity="300000"
						color="#aa44ff"
						cast-shadow="false"
					></lume-point-light>

					<lume-element3d>
						<!-- The slot where <any-element slot="alter-ego"> lands -->
						<slot name="alter-ego"></slot>
					</lume-element3d>

					<!-- bitmae cube -->
					<lume-box
						id="center-cube"
						size="120 120 120"
						mount-point="0.5 0.5 0.5"
						.rotation=${
							// Gently rotate the center cube forever.
							(x, y, z, t) => [0, t * 0.008, 0]
						}
					>
						<lume-physical-material
							texture="https://assets.codepen.io/191583/bitmae-ava.webp"
							roughness="0.9"
						></lume-physical-material>
					</lume-box>

					<!-- Camera rig so you can orbit around the scene -->
					<lume-camera-rig
						active
						distance="800"
						min-distance="200"
						max-distance="2000"
					>
						<!-- With a light on the camera so there's always light on what we're viewing -->
						<lume-point-light
							slot="camera-child"
							intensity="400000"
							color="limegreen"
						></lume-point-light>
					</lume-camera-rig>
				</lume-scene>
			`
		}
	}

	customElements.define('bit-mae', BitMae)

	/**
	 * <particle-explode> — An Element3D that fires an explosion of colored
	 * sphere particles, each with its own point-light.
	 */
	const ParticleExplode = element('particle-explode')(
		class ParticleExplode extends Element3D {
			static observedAttributeHandlers = {
				count: attribute.number,
				decayTime: attribute.number,
				velocity: attribute.number,
				colors: attribute.string,
				intensity: attribute.number,
			}

			/** Number of particles (instances + matching lights). */
			count = 30

			/** Time in seconds for particles to fully decay. */
			decayTime = 2.0

			/** Initial speed of particles when they explode. */
			velocity = 300

			/** Comma-separated hex colors. @type {string} */
			colors = '#ff2266,#22ff88,#4488ff,#ffaa00,#ee44ff'

			/** Initial total light intensity of all particles. Individual particle intensity is `intensity / count`. */
			intensity = 4_000_000

			template() {
				return html`
					<lume-instanced-mesh
						id="particles"
						size="5 5 5"
						mount-point="0.5 0.5 0.5"
						count=${() => this.count}
					>
						<lume-sphere-geometry
							horizontal-segments="6"
							vertical-segments="6"
						></lume-sphere-geometry>

						<lume-basic-material></lume-basic-material>
					</lume-instanced-mesh>
				`
			}

			#exploding = false
			#elapsed = 0
			#lastTime = performance.now()

			#mesh = null

			#lights = []

			#velocities
			#lives
			#initialScales
			#originalColors

			/** Fire a single explosion. For now the explosion starts over if called mid-explosion. */
			explode() {
				if (!this.#mesh) return

				const n = this.count
				const velocities = new Float32Array(n * 3)
				const positions = new Float32Array(n * 3)
				const initialScales = new Float32Array(n * 3)
				const originalColors = new Float32Array(n * 3)
				const lives = new Float32Array(n)

				const palette = this.colors
					.split(',')
					.map(s => s.trim())
					.filter(Boolean)

				if (palette.length === 0) palette.push('#ff2266', '#22ff88', '#4488ff')

				const speed = this.velocity

				for (let i = 0; i < n; i++) {
					// Random direction on a sphere.
					const theta = Math.random() * Math.PI * 2
					const phi = Math.acos(2 * Math.random() - 1)
					const spd = speed * (0.3 + Math.random() * 0.7)
					velocities[i * 3 + 0] = Math.sin(phi) * Math.cos(theta) * spd
					velocities[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * spd
					velocities[i * 3 + 2] = Math.cos(phi) * spd

					// All start at origin offset above the cube.
					positions[i * 3 + 0] = 0
					positions[i * 3 + 1] = 0
					positions[i * 3 + 2] = 0

					const scaleRand = Math.random()
					initialScales[i * 3 + 0] = 3 + scaleRand * 6
					initialScales[i * 3 + 1] = 3 + scaleRand * 6
					initialScales[i * 3 + 2] = 3 + scaleRand * 6

					lives[i] = 1

					// Pick a random color from the palette.
					const hex = palette[Math.floor(Math.random() * palette.length)]
					originalColors[i * 3 + 0] = parseInt(hex.slice(1, 3), 16) / 255
					originalColors[i * 3 + 1] = parseInt(hex.slice(3, 5), 16) / 255
					originalColors[i * 3 + 2] = parseInt(hex.slice(5, 7), 16) / 255
				}

				this.#velocities = velocities
				this.#lives = lives
				this.#initialScales = initialScales
				this.#originalColors = originalColors

				// Trigger the instanced-mesh to render the new data.
				this.#mesh.positions = Array.from(positions)
				this.#mesh.scales = Array.from(initialScales)
				this.#mesh.colors = Array.from(originalColors)

				this.#exploding = true
				this.#elapsed = 0
				this.#lastTime = performance.now()
			}

			connectedCallback() {
				super.connectedCallback()

				// Grab the instanced-mesh after the template renders.
				queueMicrotask(() => {
					if (!this.isConnected) return

					this.#mesh = this.querySelector('#particles')

					const MAX_LIGHTS = 20

					// Create per-particle point-lights as children of the
					// instanced-mesh so their positions are relative to it.
					// Keep a reasonable count to avoid GPU texture-unit limits.
					const lightCount = Math.min(this.count, MAX_LIGHTS)
					const frag = document.createDocumentFragment()
					for (let i = 0; i < lightCount; i++) {
						const light = document.createElement('lume-point-light').set({
							intensity: this.intensity / lightCount,
							position: [0, 0, 0],
							shadowBias: -0.01,
							mountPoint: [0.5, 0.5, 0.5],
							castShadow: false,
						})
						frag.appendChild(light)
						this.#lights.push({el: light, particleIndex: Math.floor((i / lightCount) * this.count)})
					}
					this.#mesh.appendChild(frag)
				})

				// Register the render task that drives particle animation.
				this.createEffect(() => {
					const removeTask = Motor.addRenderTask((time) => {
						this.#_tick(time)
					})
					onCleanup(removeTask)
				})
			}

			/**
			 * @param {number} time — current time in ms (from Motor)
			 */
			#_tick(time) {
				if (!this.#exploding || !this.#mesh) return

				const dt = Math.min((time - this.#lastTime) / 1000, 0.1) // cap dt at 100 ms
				this.#lastTime = time
				this.#elapsed += dt

				const lives = this.#lives
				const n = this.count
				const decayTime = this.decayTime

				if (decayTime <= 0) return

				// Read current arrays (the mesh caches these).
				const positions = this.#mesh.positions.slice()
				const meshScales = this.#mesh.scales.slice()
				const colors = this.#mesh.colors.slice()

				let anyAlive = false

				for (let i = 0; i < n; i++) {
					if (lives[i] <= 0) continue

					// Decrease remaining life.
					lives[i] -= dt / decayTime
					if (lives[i] < 0) lives[i] = 0

					// Velocity decays linearly with remaining life.
					const velFactor = lives[i]
					positions[i * 3 + 0] += this.#velocities[i * 3 + 0] * velFactor * dt
					positions[i * 3 + 1] += this.#velocities[i * 3 + 1] * velFactor * dt
					positions[i * 3 + 2] += this.#velocities[i * 3 + 2] * velFactor * dt

					// Shrink to zero as life → 0.
					meshScales[i * 3 + 0] = this.#initialScales[i * 3 + 0] * lives[i]
					meshScales[i * 3 + 1] = this.#initialScales[i * 3 + 1] * lives[i]
					meshScales[i * 3 + 2] = this.#initialScales[i * 3 + 2] * lives[i]

					// Fade colors with life.
					colors[i * 3 + 0] = this.#originalColors[i * 3 + 0] * lives[i]
					colors[i * 3 + 1] = this.#originalColors[i * 3 + 1] * lives[i]
					colors[i * 3 + 2] = this.#originalColors[i * 3 + 2] * lives[i]

					if (lives[i] > 0.001) anyAlive = true
				}

				// Move sample point-lights to matching particle positions.
				for (const {el: light, particleIndex} of this.#lights) {
					const i = particleIndex
					if (lives[i] <= 0) continue
					light.position = [positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]]
					light.intensity = (this.intensity / this.#lights.length) * lives[i]

					light.color = `rgb(${
						Math.min(255, Math.round(this.#originalColors[i * 3] * 255))
					},${
						Math.min(255, Math.round(this.#originalColors[i * 3 + 1] * 255))
					},${
						Math.min(255, Math.round(this.#originalColors[i * 3 + 2] * 255))
					})`
				}

				// Push updated arrays back to the instanced-mesh.
				this.#mesh.positions = positions
				this.#mesh.scales = meshScales
				this.#mesh.colors = colors

				if (!anyAlive) {
					this.#exploding = false
				}
			}
		},
	)
</script>
