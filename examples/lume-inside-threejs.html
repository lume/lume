<script src="./template.js" template="./template.html" title="add Lume elements to Three.js"></script>

<!-- Integration example, scene not needed, render objects in Three.js scene. -->
<lume-box id="lumeBox" size="50 50 50" position="50 50 50" align-point="0.5 0.5 0.5">
	<lume-physical-material color="#ff6600"></lume-physical-material>

	<lume-box size="50 50 50" position="30 30 30" align-point="0.5 0.5 0.5">
		<lume-physical-material color="#ff6600"></lume-physical-material>
	</lume-box>
</lume-box>

<style>
	body {
		/* An dark orange to dark blue radial gradient background */
		background: radial-gradient(circle at center, #8c3800, #001433 80%);
	}
</style>

<script type="module">
	import 'lume'
	import * as THREE from 'three'

	// Animate the Lume box rotations.
	for (const box of document.querySelectorAll('lume-box')) box.rotation = (x, y) => [x + 0.2, y + 0.2]

	// Make a Three.js scene to put Lume objects into.
	const threeScene = new THREE.Scene()

	const threeLight = new THREE.DirectionalLight(0xffffff, 1)
	threeLight.position.set(100, 100, 100)
	threeScene.add(threeLight)

	const threeAmbient = new THREE.AmbientLight('white') // soft white light
	threeAmbient.intensity = 1.2
	threeScene.add(threeAmbient)

	// Also add a Three.js mesh not created by Lume.
	const threeCube = new THREE.Mesh(
		new THREE.BoxGeometry(100, 100, 100),
		new THREE.MeshPhysicalMaterial({color: 0x0066ff, wireframe: false}),
	)
	threeCube.position.set(0, 0, 0)
	threeScene.add(threeCube)

	// Add the Lume box and its children to the Three.js cube.
	threeCube.add(lumeBox.three)

	// Create a Three.js renderer and render the scene with the Lume objects.
	const threeRenderer = new THREE.WebGLRenderer({antialias: true})
	threeRenderer.setSize(window.innerWidth, window.innerHeight)
	threeRenderer.setClearColor(0x000000, 0) // transparent background
	document.body.appendChild(threeRenderer.domElement)

	const threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 10, 1000)
	threeCamera.position.z = 500
	threeScene.add(threeCamera)

	function animate() {
		requestAnimationFrame(animate)

		// Animate the Three.js mesh
		threeCube.rotation.x += 0.005
		threeCube.rotation.y += 0.005

		threeRenderer.render(threeScene, threeCamera)
	}

	animate()
</script>
